services:

  opsmate:
    build: .
    container_name: opsmate-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: opsmate
      DB_USER: opsmate
      DB_PASSWORD: opsmatepassword
    depends_on:
      - database
    networks:
      - opsmate-network

  database:
    image: postgres:16-alpine
    container_name: opsmate-db
    environment:
      POSTGRES_DB: opsmate
      POSTGRES_USER: opsmate
      POSTGRES_PASSWORD: opsmatepassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - opsmate-network

networks:
  opsmate-network:

volumes:
  postgres-data:
